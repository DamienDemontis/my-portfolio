<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Manifest: solo metadati (nome, icone, colori) per bookmark e schermata
         home. `display` è "browser" apposta — con "standalone" Chrome/Edge
         considerano il sito installabile e mostrano il prompt "Installa app",
         che qui non vogliamo. I PNG 192/512 sono le misure richieste; l'SVG c'è
         per chi preferisce il vettoriale. Generati da favicon.svg sul fondo del
         tema — il segno è bianco su trasparente, altrimenti sarebbe invisibile. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- iubenda Privacy Controls and Cookie Solution.
         Configuration as generated by iubenda, plus two additions the SPA needs:

         · `lang`, taken from the URL. The site serves /it and /en, and
           csLangConfiguration below keys its two cookie policies as "it" and
           "en-GB" — without this the banner and the policy it links could be in
           a different language from the page around them.

         · the consent callback. GA4 is NOT in this page at all: it is loaded by
           src/features/measure/measure.js, and only when this fires, so
           before consent the site makes no request to Google whatsoever.
           `onPreferenceExpressedOrNotNeeded` covers both cases the config
           allows — a preference actually expressed, and a visitor for whom
           consent is not required (gdprAppliesGlobally is false and
           countryDetection is on). Purpose 4 is Measurement, i.e. analytics;
           perPurposeConsent is true, so accepting marketing alone must not
           start it. -->
    <script type="text/javascript">
      var _iub = _iub || [];
      /* Colours live HERE, not in CSS. iubenda writes them onto the banner as
         inline `!important` declarations, and an inline !important beats an
         author stylesheet's !important — so a CSS override is unwinnable.
         Layout, type and spacing are not inline-styled, and those are handled
         in src/styles/iubenda.css. Palette matched to the site: black ground,
         #FEFF00 for the primary action. */
      _iub.csConfiguration = {"applyGdprForCH":false,"askConsentAtCookiePolicyUpdate":true,"countryDetection":true,"enableFadp":true,"enableLgpd":true,"enableUspr":true,"floatingPreferencesButtonDisplay":"bottom-right","gdprAppliesGlobally":false,"lgpdAppliesGlobally":false,"perPurposeConsent":true,"siteId":3109453,"whitelabel":false,"cookiePolicyId":72597078,"banner":{"acceptButtonCaptionColor":"#1A191F","acceptButtonColor":"#FFEA37","acceptButtonDisplay":true,"applyStyles":false,"backgroundColor":"#1A191F","closeButtonDisplay":false,"customizeButtonCaptionColor":"#1A191F","customizeButtonColor":"#FFFFFF","customizeButtonDisplay":true,"explicitWithdrawal":true,"listPurposes":true,"ownerName":"Studio MACACO","position":"bottom","rejectButtonCaptionColor":"#1A191F","rejectButtonColor":"#D44A20","rejectButtonDisplay":true,"showPurposesToggles":true,"showTotalNumberOfProviders":true}};
      _iub.csLangConfiguration = {"it":{"cookiePolicyId":72597078},"en-GB":{"cookiePolicyId":14380442}};

      _iub.csConfiguration.lang =
        window.location.pathname.indexOf('/en') === 0 ? 'en-GB' : 'it';

      _iub.csConfiguration.callback = {
        onPreferenceExpressedOrNotNeeded: function (preference) {
          var allowed = !preference || !!(preference.purposes && preference.purposes[4]);
          if (!allowed) return;
          // On a repeat visit iubenda replays the stored consent immediately,
          // which can happen BEFORE the app bundle has parsed and published
          // macacoStartAnalytics. Record it either way; measure.js reads this
          // flag when it loads, so consent is never silently dropped.
          window.macacoAnalyticsConsent = true;
          if (window.macacoStartAnalytics) window.macacoStartAnalytics();
        },
      };
    </script>
    <script type="text/javascript" src="https://cs.iubenda.com/autoblocking/3109453.js"></script>
    <script type="text/javascript" src="//cdn.iubenda.com/cs/gpp/stub.js"></script>
    <script type="text/javascript" src="//cdn.iubenda.com/cs/iubenda_cs.js" charset="UTF-8" async></script>
    <!-- Per-URL title, description, canonical, hreflang, Open Graph and
         JSON-LD are injected into each built page by scripts/generate-seo.mjs
         (npm run build), and kept in sync on client-side navigation by
         src/seo/Seo.jsx. The title below is only the dev-server fallback. -->
    <!-- Fonts are self-hosted from /fonts — the @font-face rules live at the
         top of src/index.css. Preloaded here because they are discovered only
         after the CSS parses, and these two carry almost every glyph on the
         page: the body mono and the display face. -->
    <link
      rel="preload"
      href="/fonts/roboto-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/syncopate-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Anti-FOUC del banner cookie. `applyStyles: false` fa arrivare il
         banner SENZA stile: position:static, nel flusso, in cima al body. Il
         suo aspetto è tutto in src/styles/iubenda.css, che in dev Vite inietta
         via JS DOPO il grafo dei moduli — e iubenda_cs.js arriva dalla CDN
         molto prima (misurato: banner a ~106ms, zero stylesheet, #root ancora
         vuoto). Risultato: qualche centinaio di ms di schermata bianca con
         l'informativa a tutta pagina. In produzione il CSS è un <link> che
         blocca il primo paint e il problema non si vede, ma il margine è
         sottile e basta un CSS servito lento per riaprirlo.

         Queste poche righe sono solo il PIAZZAMENTO, non lo stile: tolgono il
         banner dal flusso appena esiste, qualunque cosa sia già stata
         caricata. Colori, tipografia e spaziature restano in iubenda.css —
         che sovrascrive queste regole per specificità pari e ordine. Lo sfondo
         su html evita il lampo bianco dietro a #root ancora vuoto (stesso nero
         di `body` in src/index.css). -->
    <style>
      html { background: #000; }
      #iubenda-cs-banner {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 199000;
        background: rgba(10, 10, 10, 0.8);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Studio MACACO — Creative Studio for Interactive Experiences</h1>
      <p>Studio MACACO is a Swiss creative studio designing and producing interactive experiences for brands, cultural institutions and destinations. We combine creative direction, design, storytelling and technology to turn identities, stories and content into games, installations and digital worlds to explore.</p>
      <h2>CREATIVITY</h2>
      <p>We give ideas a creative direction. Concepts, art direction, design and storytelling turn a brand’s identity or a story into a distinctive experience shaped around its audience.</p>
      <h2>CRAFT</h2>
      <p>From characters and environments to interfaces and objects, we shape the visual language and every detail of the experience. Artists, designers and developers work together to bring the concept to life.</p>
      <h2>TECHNOLOGY</h2>
      <p>Creative coding, real-time 3D, AI, AR, VR and electronics are expressive tools. We choose them around the idea and the people, creating interactions between content, physical spaces and digital worlds.</p>
      <h2>STRATEGY</h2>
      <p>We start with what you want to communicate and the people you want to engage. We define the concept, audience journey and format: a brand experience, a cultural installation, a game or an adventure through a destination.</p>
      <h2>INNOVATION</h2>
      <p>Our in-house lab feeds our creative work. We experiment with expressive formats, technologies and materials, building prototypes to discover new possibilities for the experiences we imagine.</p>
      <h2>DELIVERY</h2>
      <p>We take projects from concept to production. We bring creative direction, design, development and integration together, working with project partners to put the experience in front of its audience.</p>
      <h2>Featured Projects</h2>
      <ul><li><a href="/en/projects/berco-supersize">Berco Supersize</a> — A brand experience for Berco at Bauma 2025: arcade gameplay turns the trade-show stand into a place to explore industrial products.</li><li><a href="/en/projects/kebhouze-the-game">Kebhouze The Game</a> — Art direction and 2D/3D art turn the Kebhouze mascot into an arcade world, bringing the brand’s identity into a shared game experience.</li><li><a href="/en/projects/digitart-3d-giulia-caffo">Digiart 3D: Giulia Caffo</a> — Five chapters, five minigames and a ceramics collection made explorable through two large touch tables.</li><li><a href="/en/projects/aquatar">Aquatar</a> — A digital aquarium. Two virtual characters. An AI system able to turn requests into visible actions.</li><li><a href="/en/projects/become-this-way">Become this way</a> — A robot vacuum wants to become a fish. An interactive tale about identity, expectations and the freedom to choose your own shape.</li><li><a href="/en/projects/playstorming">Playstorming</a> — A multiplayer platform turns qualitative research into a session that is participatory, configurable and measurable.</li></ul>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
