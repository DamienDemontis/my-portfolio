<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <!-- Per-URL title, description, canonical, hreflang, Open Graph and
         JSON-LD are kept in sync on navigation by src/seo/Seo.jsx. The title
         below is only the fallback before the app mounts. -->
    <title>Damien Demontis</title>
    <!-- Fonts are self-hosted from /fonts — the @font-face rules live in
         src/styles/tokens.css. Preloaded here because they are discovered
         only after the CSS parses, and these two carry almost every glyph on
         the page: the body mono and the display face. -->
    <link
      rel="preload"
      href="/fonts/martian-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/redaction-20.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Same black as `body` in src/styles/index.css: no white flash behind
         an empty #root. -->
    <style>
      html { background: #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
